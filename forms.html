<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Namespace</title>
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: #555;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 15px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #1a242f;
    }

    .secondary-button {
      background-color: #7f8c8d;
    }

    .secondary-button:hover {
      background-color: #5c6365;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Configurar Namespace</h2>
    <form id="namespaceForm">
      <label for="cores">Quantidade de Cores (max 2)</label>
      <input type="number" id="cores" name="cores" min="1" max="2" required>

      <label for="cpu">CPU (em %)</label>
      <input type="number" id="cpu" name="cpu" min="1" max="100" required>

      <label for="memoria">Memória (max 4096 MB)</label>
      <input type="number" id="memoria" name="memoria" min="1" max="4096" required>

      <label for="io">Tempo de IO por segundo (ms)</label>
      <input type="number" id="io" name="io" min="1" required>

      <label for="script">Script (comandos/programas)</label>
      <textarea id="script" name="script" rows="4" required></textarea>

      <button type="submit">Criar Namespace</button>
      <button type="button" class="secondary-button" onclick="goToMonitor()">Monitorar Namespaces</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('namespaceForm');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const cores = parseInt(document.getElementById('cores').value);
      const memoria = parseInt(document.getElementById('memoria').value);

      if (cores > 2) {
        alert("Você só pode usar até 2 cores.");
        return;
      }

      if (memoria > 4096) {
        alert("A memória máxima permitida é 4096 MB.");
        return;
      }

      // Aqui você pode fazer o envio para o servidor com fetch ou XMLHttpRequest
      const dados = {
        cores: cores,
        cpu: document.getElementById('cpu').value,
        memoria: memoria,
        io: document.getElementById('io').value,
        script: document.getElementById('script').value
      };

      console.log("Dados enviados:", dados);
      alert("Namespace criado com sucesso!");
      form.reset();
    });

    function goToMonitor() {
      window.location.href = "monitoramento.html"; // Troque pela URL correta da sua página
    }
  </script>
</body>
</html>
